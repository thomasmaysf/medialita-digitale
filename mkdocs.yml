site_name: Educazione alla Medialità Digitale
site_description: Wiki del programma Patentino digitale — Scuola Rudolf Steiner, Trento
site_url: https://thomasmaysf.github.io/medialita-digitale/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Passa alla modalità scura
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Passa alla modalità chiara

plugins:
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: it
          default: true
          name: Italiano
          site_name: Educazione alla Medialità Digitale
          site_description: Wiki del programma Patentino digitale — Scuola Rudolf Steiner, Trento
          theme:
            language: it
        - locale: en
          name: English
          site_name: Digital Media Education
          site_description: Wiki for the Digital License program — Rudolf Steiner School, Trento
          theme:
            language: en
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: teal
                accent: amber
                toggle:
                  icon: material/brightness-7
                  name: Switch to dark mode
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: teal
                accent: amber
                toggle:
                  icon: material/brightness-4
                  name: Switch to light mode
          nav_translations:
            Home: Home
            "Come replicare il percorso": How to run this yourself
            Calendario: Calendar
            Moduli: Modules
            Regole generali: General rules
            Materiali: Materials
            Iscrizioni: Registration
            Patto digitale: Digital pact
            Risorse: Resources
            "Modulo 1 — Logica binaria e primi dispositivi": "Module 1 — Binary logic and first devices"
            "Modulo 2 — Simboli, materiali del telefono e fotografia": "Module 2 — Symbols, phone materials, and photography"
            "Modulo 3 — Social, linguaggio digitale e musica": "Module 3 — Social media, digital language, and music"
            "Modulo 4 — Algoritmi, autoregolazione e privacy": "Module 4 — Algorithms, self-regulation, and privacy"
            "Modulo 5 — Identità, sicurezza online e cianografia": "Module 5 — Identity, online safety, and cyanotype"
            "Modulo 6 — Intelligenza artificiale, elettromagnetismo e riciclo": "Module 6 — Artificial intelligence, electromagnetism, and recycling"
            "Modulo 7 — Feedback e consegna del patentino": "Module 7 — Feedback and certificate ceremony"

markdown_extensions:
  - admonition
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Come replicare il percorso: come-replicare.md
  - Moduli:
    - "Modulo 1 — Logica binaria e primi dispositivi": moduli/modulo-1.md
    - "Modulo 2 — Simboli, materiali del telefono e fotografia": moduli/modulo-2.md
    - "Modulo 3 — Social, linguaggio digitale e musica": moduli/modulo-3.md
    - "Modulo 4 — Algoritmi, autoregolazione e privacy": moduli/modulo-4.md
    - "Modulo 5 — Identità, sicurezza online e cianografia": moduli/modulo-5.md
    - "Modulo 6 — Intelligenza artificiale, elettromagnetismo e riciclo": moduli/modulo-6.md
    - "Modulo 7 — Feedback e consegna del patentino": moduli/modulo-7.md
  - Regole generali: regole-generali.md
  - Materiali: materiali.md
  - Calendario: calendario.md
  - Iscrizioni: iscrizioni.md
  - Patto digitale: patto-digitale.md
  - Risorse: risorse.md

extra:
  social: []

copyright: 'Contenuti didattici: <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a> · Edizione Trento: Gruppo promotore, Scuola Rudolf Steiner'
